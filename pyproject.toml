[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lara"
version = "0.1.0"
description = "Local arXiv Research Assistant — RAG over arXiv ML papers with local LLMs on vLLM"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "James Bedichek", email = "james.bedichek@gmail.com" }]
classifiers = [
  "License :: Other/Proprietary License",
  # Rejected by PyPI on upload. This package is proprietary and must not be
  # published to a public index; the classifier makes an accidental
  # `twine upload` fail loudly instead of silently distributing it.
  "Private :: Do Not Upload",
]

dependencies = [
  # Base = what it takes to SEARCH and READ a corpus that already exists. Anything only
  # needed to BUILD one lives in the `ingest` extra, and anything platform-specific in
  # `mac` / `cuda` / `cpu`. Most people download the corpus and never build one.
  #
  # Five packages were declared here and imported nowhere: pyarrow (159 MB), openai,
  # tenacity, pydantic-settings and sse-starlette. Removed rather than left to age.
  #
  # config / CLI
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.9",
  # http — the reader talks to the generator over plain OpenAI-compatible HTTP
  "httpx[http2]>=0.27",
  # reading papers: lxml renders the cached LaTeXML, zstandard decompresses it
  "lxml>=5.3",
  "zstandard>=0.23",
  # Opening an uncrawled paper fetches and parses it on demand, so the reader performs
  # ingest even on a base install -- the `ingest` extra is for building a corpus in
  # bulk, not for touching the network at all. aiolimiter is imported at module scope by
  # lara.ingest.fulltext, so without it /api/fetch raises ModuleNotFoundError on the
  # first paper that has no cached full text. Pure Python, no dependencies of its own.
  "aiolimiter>=1.1",
  # embedding and search
  "numpy>=2.1",
  "huggingface-hub>=0.26",
  "sentence-transformers>=5.0",
  "transformers>=4.55",
  "torch>=2.7",
  # serving
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # Imported directly -- middleware, responses and run_in_threadpool -- not merely
  # through FastAPI. It happens to be installed because FastAPI depends on it, which is
  # exactly why this was missing: it has never once failed. Declared so the day FastAPI
  # changes what it pins is not the day the reader stops importing.
  "starlette>=0.40",
]

[project.optional-dependencies]
# ── pick ONE platform extra ───────────────────────────────────────────────────
# Apple Silicon. mlx-lm is the fastest generator on this hardware and is marked so it
# cannot be pulled onto a machine that has no Metal to run it on.
mac = [
  "faiss-cpu>=1.9",
  "mlx-lm>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# NVIDIA. faiss-gpu-cu12 carries its own CUDA runtime, so only install it if you have one.
cuda = ["faiss-gpu-cu12>=1.9"]
# Linux/Windows without a GPU.
#
# NOTE: `pip install torch` from PyPI drags in ~5.4 GB of CUDA runtime wheels even on a
# machine with no NVIDIA card. To avoid that, install torch from the CPU index first:
#     pip install torch --index-url https://download.pytorch.org/whl/cpu
#     pip install -e '.[cpu]'
# macOS is unaffected: the arm64 wheels have no CUDA payload.
cpu = ["faiss-cpu>=1.9"]

# ── optional capabilities ─────────────────────────────────────────────────────
# Building a corpus from scratch, plus the PDF fallback. Not needed if you downloaded one
# with `lara dataset pull`: the reader's on-demand fetch reads arXiv's HTML and ar5iv,
# both of which the base install handles. pymupdf stays optional because it is ~30 MB and
# only the last resort for the minority of papers with no HTML at all -- without it that
# source is skipped and recorded, rather than failing the fetch.
ingest = ["pymupdf>=1.24"]
# Generation backends. llama.cpp is a binary, not a package — `brew install llama.cpp`.
vllm = ["vllm>=0.10; sys_platform == 'linux'"]
serve = ["vllm>=0.10; sys_platform == 'linux'"]   # legacy alias for `vllm`
# Fine-tuning the embedder (`lara finetune`) needs the Muon optimiser, which is NOT
# declarable here: `pip install muon` fetches "Multimodal omics analysis framework", an
# unrelated project that owns the name on PyPI. Installing it would satisfy the import
# and then fail on the symbol, which is worse than not having it. Install from source:
#     pip install git+https://github.com/KellerJordan/Muon
# Everything except `lara finetune` works without it.
finetune = []
# No pytest-asyncio: the few coroutine tests drive asyncio.run directly, so the suite
# runs with plain pytest and nothing else.
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13"]

[project.scripts]
lara = "lara.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["lara"]

# Ship the portable defaults INSIDE the package. `packages = ["lara"]` alone excludes the
# repo-root config.yaml, so a non-editable `pip install .` produced a wheel with no config
# at all and every command failed with FileNotFoundError. One source of truth, copied in
# at build time — see lara.config.PACKAGED_DEFAULT.
[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "lara/config.default.yaml"

[tool.hatch.build.targets.sdist]
include = ["lara", "config.yaml", "README.md", "LICENSE", "SETUP_INSTRUCTIONS.md", "docs", "web"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
