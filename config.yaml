# Local arXiv Research Assistant — PORTABLE DEFAULTS
#
# This file is tracked in git and must run on any machine. Anything specific to one
# computer — which disk is real, how many GPUs it has, which model is downloaded — belongs
# in `config.local.yaml`, which deep-merges over this file and is gitignored.
#
# `lara setup` writes that file for you. You can also write it by hand; see
# docs/setup/device_detection.md and PLAN.md D16.
#
# Every path here is checked by `lara preflight`, which resolves symlinks with realpath
# and refuses to run if a path lands somewhere it should not or if free space is below
# `disk.min_free_gb`.
# ───────────────────────────────────────────────────────────────────────────────

disk:
  # Relative paths resolve against THIS FILE's directory, not the working directory, so
  # `./data` means the same thing however lara is invoked. Override in config.local.yaml
  # to put the corpus on a different disk.
  root: ./data
  # Pin the backing device (e.g. /dev/nvme0n1p5) in config.local.yaml if the machine has
  # more than one filesystem and only some are usable. null means "wherever it resolves".
  required_device: null
  min_free_gb: 20            # a full ML corpus needs ~120 GB; raise this once you know
  forbid_paths: []           # hard-blocked prefixes, even if something points there

paths:
  metadata_db:  ${disk.root}/meta.sqlite       # papers, sections, chunks, FTS5
  vectors_fp16: ${disk.root}/vectors/fp16.bin  # tier 2, mmap'd, 768-d
  vectors_int8: ${disk.root}/vectors/int8.bin  # tier 1, MRL-256
  papers_fp16:  ${disk.root}/vectors/papers_fp16.bin   # paper-level, title+abstract
  papers_int8:  ${disk.root}/vectors/papers_int8.bin
  graph:        ${disk.root}/graph/            # CSR citation adjacency
  raw_cache:    ${disk.root}/raw/              # transient fetched HTML, prunable
  logs:         ${disk.root}/logs/
  memory:       ${disk.root}/memory/           # reading history, folders, prompt override

# Hugging Face cache. Pinned explicitly so a stray HF_HOME in the environment cannot
# redirect 100 GB of downloads onto a disk with no room. Override if your cache lives
# elsewhere — check it is a real directory and not a symlink onto a full filesystem.
huggingface:
  home: ~/.cache/huggingface
  offline: false

corpus:
  # D1: Core scope, 2015+  (~330k papers, ~16M chunks)
  categories: [cs.LG, cs.CL, stat.ML, cs.NE]
  date_floor: "2015-01-01"

ingest:
  # D2: abstracts for everything up front; full text lazily + background crawl.
  # D12: OAI-PMH rather than the Kaggle snapshot — no account or API token needed, and it
  # doubles as the nightly incremental path. Harvests the `cs` and `stat` sets in FULL;
  # the 2015 floor is applied to the v1 submission date at ingest, because OAI's `from=`
  # filters on last-modified datestamp instead. See lara/ingest/oai.py.
  oai_endpoint: https://export.arxiv.org/oai2
  oai_min_interval_sec: 3.0        # arXiv's stated OAI guidance; ~1300 records per request
  fulltext:
    # Q11: 2-4 req/s, back off hard on 429. Tune `rate_per_sec` down if arXiv complains.
    # Probing for arXiv's actual ceiling. 3 req/s ran ~14k papers with zero 429s, so the
    # limit is higher than that; this steps up hard to find it. The adaptive halving below
    # is the safety net -- it only ever ratchets DOWN, so an overshoot self-corrects to a
    # sustainable rate rather than hammering. Every 429 and every halving is logged.
    rate_per_sec: 40.0
    max_concurrency: 48
    user_agent: "Local-arxiv-Research-Assistant/0.1 (+https://github.com/JBedichek/Local-arxiv-Research-Assistant; mailto:james.bedichek@gmail.com)"
    backoff:
      on_429_initial_sec: 60
      multiplier: 2.0
      max_sec: 3600
      # Three consecutive 429s drops rate_per_sec by half and logs a warning.
      adaptive_throttle: true
    sources: [arxiv_html, ar5iv, pdf]   # tried in order
  citations:
    # Q6: Semantic Scholar, unauthenticated to start. Verified working 2026-08-17.
    batch_endpoint: https://api.semanticscholar.org/graph/v1/paper/batch
    batch_size: 500                      # 377k papers ≈ 755 requests
    min_interval_sec: 1.1                # unauthenticated tier is a shared pool
    api_key_env: S2_API_KEY              # optional; set it if we ever get throttled
    fallback: openalex

chunking:
  target_chars: 1000
  overlap_frac: 0.15
  never_cross_sections: true

embedding:
  model: google/embeddinggemma-300m      # fully present in cache (1.2 GB), Matryoshka
  dim_full: 768
  dim_truncated: 256                     # MRL truncation for the warm tier
  batch_size: 512
  max_seq_len: 512
  # `auto` uses every accelerator it finds. A list of CUDA ordinals ([0, 1, 2]) pins
  # specific cards and is what you want when a GPU is reserved for the generator; extra
  # entries collapse harmlessly on smaller machines, and non-CUDA hardware maps onto its
  # single device. See lara/device.py.
  #
  # Multi-GPU fans out through one worker pool with a single parent writer -- separate
  # processes per GPU would race on the append-only vector files.
  devices: auto
  # torch.compile. dynamic=true is important: sentence-transformers sorts by length and
  # pads per batch, so the encoder sees many shapes; static compilation would re-autotune
  # on each one and lose more than it gains. See lara/index/embed.py.
  # Measured: 'default' = 1027 chunks/s (2.19x eager). max-autotune-no-cudagraphs was
  # tried and is far worse -- 51 chunks/s dynamic, 101 with padding forced static -- it
  # never stops re-autotuning against length-sorted batches. See embed.py for the table.
  compile: default                      # null to disable
  compile_dynamic: true
  slice_size: 8192                       # chunks per durable checkpoint
  # Documents carry a contextual prefix: "title: {paper} > {section} | text: {chunk}".
  # A free stand-in for contextual retrieval, which would otherwise cost one LLM call per
  # chunk. Queries use a DIFFERENT prompt -- EmbeddingGemma is asymmetric.
  #
  # The prefixes are NOT configurable, and used to look as though they were. They are
  # QUERY_PREFIX and doc_prefix_for() in lara/index/embed.py, because the fine-tuning code
  # has to build the identical string: a corpus embedded with one prefix and queried with
  # another retrieves nothing, and two copies of the text drifted apart exactly that way.

retrieval:
  # Hierarchical scope: answer from the open paper before searching 29.5M chunks.
  # A reader asking "why does this need a warmup?" almost always means *this paper*.
  #
  #   paper -> neighbourhood (what it cites / what cites it) -> corpus
  #
  # Between tiers the model marks which passages actually helped, and those become extra
  # query vectors for the wider search — fused by reciprocal rank fusion, never averaged.
  # Feedback widens recall only; the question alone still decides the final order.
  hierarchy:
    enabled: true
    paper_frac: 0.2          # of the paper's chunks to consider...
    paper_min_k: 5           # ...clamped, since papers run from 15 to 300+ chunks
    paper_max_k: 30
    tag_with_model: true     # false = keep the reranker's top 3, no LLM call
    max_feedback_vectors: 4  # each is another dense search and another list in the fusion
    allow_neighbourhood: true
    allow_corpus: true

  # Deep automated research: iterative retrieval, structured extraction, consolidation.
  # No round cap — a run ends when consecutive rounds stop finding anything new, or when
  # the model reports no remaining gap. Minutes, not seconds; cancellable from the UI.
  synthesis:
    per_round: 12            # excerpts read per round
    over_fetch: 4            # retrieve this many times per_round, then drop seen + diversify
    cap_per_paper: 3         # so one long on-topic paper cannot fill a round
    dry_rounds: 2            # consecutive rounds with nothing new before stopping
    min_rounds: 4            # the model's stop vote is ignored below this depth
    stop_votes: 2            # consecutive stop votes needed to end a run
    max_feedback_vectors: 6
    expand_every: 2          # every Nth round walks the citation graph instead of dense

index:
  # Tier-1 search backend. `lara bench-index` measures these on your machine and
  # `lara setup` writes the answer into config.local.yaml.
  #
  # Measured p50 / recall@200 / full-corpus memory (see lara/index/backends.py):
  #   torch fp16 cuda    1.1ms  1.000  15.1 GB   fastest anywhere
  #   torch int8 cuda    8.2ms  0.996   7.5 GB   half the memory for 0.4% recall
  #   torch fp16 cpu    12.3ms  0.995  15.1 GB   best exact CPU option
  #   torch int8 cpu     282ms  0.995   7.5 GB   avoid: dequant is not vectorised on CPU
  #   faiss flat        61.3ms  0.996  30.3 GB   slower AND larger than torch fp16
  #   faiss sq8          372ms  0.991   7.5 GB   smallest, far too slow
  #   faiss hnsw         2.1ms  0.979  37.9 GB   fastest at scale, memory-hungry
  #
  #   backend: auto -> torch. faiss is opt-in and worth it only for hnsw.
  #   precision: fp16 | int8. int8 is a GPU optimisation; on CPU it is 25x slower.
  #
  # No backend fits the full corpus on a laptop. Use `lara corpus scope` to keep only the
  # topics you care about resident — at keep=0.05 this is ~1.4M chunks, where torch fp16
  # needs 0.7 GB and answers in single-digit ms.
  backend: auto
  precision: fp16
  faiss:
    kind: hnsw                           # flat (exact) | sq8 (exact-ish, 4x smaller) | hnsw (approximate)
    m: 32                                # hnsw graph degree
    ef_construction: 200
    # recall@200 measured on 1M real vectors: 64 -> 0.750, 256 -> 0.938, 512 -> 0.979,
    # 1024 -> 0.993. Below 512 you silently lose a large slice of the true top-k.
    ef_search: 512
    threads: 0                           # 0 leaves faiss's default
  rerank:
    tier2_candidates: 200                # exact fp16 rescore from mmap
    final_k: 20
    # D13 (revised again): one reranker, and it is the *seq-cls* Qwen3 0.6B.
    #
    # THE REPO NAME MATTERS MORE THAN THE FAMILY. Qwen3-Reranker natively scores via
    # yes/no LM logits, which sentence-transformers' CrossEncoder does not implement --
    # it builds a Qwen3ForSequenceClassification whose score.weight is RANDOMLY
    # INITIALISED. That returns plausible floats and dutifully ranks documents, so the
    # failure is invisible without a behavioural check: measured, `Qwen/Qwen3-Reranker-0.6B`
    # gave a self-attention passage 0.865 and a recipe for frying onions 0.862.
    #
    # `tomaarsen/*-seq-cls` are conversions with a *trained* classification head, which is
    # why they work where the upstream repo does not. Do not "simplify" this back to
    # Qwen/Qwen3-Reranker-0.6B -- it is the same model by name and noise by behaviour.
    #
    # Measured on a relevant-vs-irrelevant separation probe:
    #   Qwen/Qwen3-Reranker-0.6B              broken   0.865 vs 0.862    67ms/50
    #   tomaarsen/Qwen3-Reranker-4B-seq-cls   marginal 0.893 vs 0.695   333ms/50
    #   tomaarsen/Qwen3-Reranker-0.6B-seq-cls ok       0.799 vs 0.376    68ms/50  <- chosen
    #   BAAI/bge-reranker-v2-m3               ok       0.401 vs 0.000    40ms/50
    #
    # 0.6B-seq-cls over bge: a wider separation margin (0.423 vs 0.401) for 28ms/50 more,
    # and it keeps the stack on one model family. 4B-seq-cls is 5x the latency for a
    # margin that is worse, not better.
    #
    # load_cross_encoder runs assert_reranker_works at load time (verify=True by default),
    # so an untrained head fails loudly at startup rather than degrading ranking to noise.
    cross_encoder:
      enabled: true
      model: tomaarsen/Qwen3-Reranker-0.6B-seq-cls
      device: 1
      candidates: 24               # 24 costs 20ms vs 40ms for 50; tier 2 already ranks well
      batch_size: 24
      max_length: 512
  lexical:
    enabled: true
    backend: fts5
    rrf_k: 60                            # reciprocal rank fusion constant
    # Query planning by inverse document frequency. OR-ing every term over 2.5M chunks
    # costs 212-353 ms because common words drag in enormous posting lists; requiring all
    # terms returns 0-3 rows. Keeping only the rarest few is both fast and correct -- BM25
    # earns its keep on discriminative tokens (GQA, MQA, dataset names), not on "how does".
    max_terms: 3
    df_ceiling_frac: 0.005               # drop terms appearing in >0.5% of chunks

# Written by `lara setup` into config.local.yaml, not set here: only the wizard knows what
# the index costs on this machine, and the answer changes when you rescope the corpus.
# The reader reports both through /api/device so the model picker can say what will fit
# before you download 8 GB of the wrong thing. Absent until setup has run — both are null
# on a fresh install, and the UI copes.
hardware:
  generator_headroom_gb: null       # RAM/VRAM left for the generator once the index loads
  generator_max_params_4bit: null   # the largest model that fits in it, 4-bit quantised

hot_tier:
  # Tier 0: pin the open paper + its 1-hop citation neighbourhood at full fp16.
  #
  # NOT IMPLEMENTED. These keys are read by nothing that serves — grep finds max_bytes in
  # the setup planner and nowhere else, and /api/meminfo reports hot_tier_allocated:
  # false. Tier 0 is currently a filtered case of tier 1 (see lara/index/search.py), which
  # needs no separate cache. The planner used to reserve max_bytes anyway, which made
  # every machine look 2 GB smaller than it is and pushed corpus scoping harder than the
  # evidence supported; it now reserves nothing. Left here as the design intent, so
  # whoever implements tier 0 has the knobs — but it costs no memory today.
  max_bytes: 2_000_000_000
  pin_open_paper: true
  pin_neighbors_hops: 1
  lru_papers: 20

serving:
  # Authentication. `auto` means: not required on loopback, MANDATORY anywhere else —
  # `lara serve --host 0.0.0.0` refuses to start without a token rather than coming up
  # unprotected. `always` demands one even on loopback (shared machine); `off` disables
  # the check, and exists so that wanting the old behaviour has to be said in writing.
  #
  # The token itself belongs in config.local.yaml or, better, in $LARA_TOKEN so it is
  # never written to disk. Generate one with: python -c "import secrets;print(secrets.token_urlsafe(32))"
  auth:
    # `auto` never prompts on loopback, so ordinary local use asks for nothing. It only
    # demands a token when you bind somewhere reachable. Turn it off for a machine in
    # config.local.yaml rather than here — this default protects `--host 0.0.0.0`.
    #
    # Quote the value if you set "off": YAML 1.1 reads a bare `off` as the boolean False.
    # lara handles both spellings, but other tools reading this file may not.
    mode: auto           # auto | always | off
    token: null

  # 127.0.0.1 keeps the reader on this machine only. Set 0.0.0.0 to reach it from other
  # devices on the LAN (or run `lara serve --host 0.0.0.0`).
  #
  # With auth.mode: off there is NO authentication on any endpoint, so 0.0.0.0 exposes to
  # everything that can route here: the corpus, `/api/model/download` (which pulls
  # arbitrary HF repos onto this disk using your HF_TOKEN), `/api/ask` (free inference on
  # your GPU), `/api/fetch` (makes this machine crawl arXiv), and the memory endpoints
  # (which can delete your library). Fine on a trusted home network; on a shared, café or
  # conference network, set mode back to `auto`. Note vLLM already binds 0.0.0.0:8000.
  host: 127.0.0.1
  port: 8080
  # Which inference server generates answers, and whether `lara serve` starts it for you.
  #
  #   backend: auto    vllm on CUDA, mlx then llama.cpp on Apple Silicon, llama.cpp on CPU
  #            vllm      HF safetensors. Fastest with a real GPU. No Metal backend.
  #            llamacpp  GGUF. Runs everywhere, most mature. `brew install llama.cpp`
  #            mlx       MLX format, Apple Silicon only. `pip install mlx-lm`
  #            external  you start it yourself; lara only uses base_url
  #
  # The three formats are NOT interchangeable, so each backend has its own `model`.
  # Pointing llama.cpp at a safetensors repo fails at load time.
  generator:
    backend: auto
    autostart: true             # start the server with the reader, stop it on exit
    startup_timeout_sec: 300
    llamacpp:
      model: null               # GGUF, e.g. "Qwen/Qwen3-8B-GGUF:Q4_K_M", or a .gguf path
      ctx_size: 32768
      n_gpu_layers: 999         # offload everything; ignored on CPU-only builds
      parallel: 2
      flash_attn: true
      cache_reuse: 256          # prefix reuse — what keeps follow-ups on one paper fast
      cache_type_k: null        # e.g. q8_0 to shrink the KV cache
      cache_type_v: null
      extra_args: []
    mlx:
      model: null               # e.g. "mlx-community/Qwen3-8B-4bit"
      extra_args: []
    ollama:
      # A tag you have already pulled (`ollama pull qwen3:8b`). Ollama loads models on
      # demand, so the daemon is not told which one — this is just the name requests use.
      model: null               # e.g. "qwen3:8b"
      host: 127.0.0.1
      port: 11434               # ollama serve takes no port flag; set via OLLAMA_HOST
      extra_args: []
  vllm:
    # D4: GGUF ignored, vLLM only. Q4: rare switching — one model resident at a time.
    base_url: http://127.0.0.1:8000/v1
    startup_timeout_sec: 300
    # null lets vLLM use whatever CUDA_VISIBLE_DEVICES exposes. Pin a card in
    # config.local.yaml when the embedder or reranker needs one kept clear.
    gpu_devices: null
    gpu_memory_utilization: 0.5
    enable_prefix_caching: true
    kv_cache_dtype: auto
    max_model_len: 32768
    max_num_seqs: 64
    # No portable default: the right generator depends entirely on how much memory the
    # machine has, and silently trying to load a 27B checkpoint on a laptop is a worse
    # failure than saying nothing is configured. `lara setup` picks one, the UI's model
    # menu changes it, and `lara serve-llm --model ...` overrides it per run.
    default_model: null
    default_quantization: null
  # How long the server may sit idle before it releases cached device memory. 0 disables
  # the reaper. Read at startup; the reaper never fires while a query is in flight.
  empty_cache_sec: 60
