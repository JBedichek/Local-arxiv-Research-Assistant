<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local arXiv Research Assistant</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="bar">
  <span class="brand">lara</span>
  <form id="open-form">
    <input id="arxiv-input" type="text" placeholder="arXiv id, or search: papers on Muon learning rate adaptation" spellcheck="false" autocomplete="off">
    <button type="submit">Go</button>
  </form>
  <label>scope
    <select id="scope">
      <option value="corpus">whole corpus</option>
      <option value="paper">this paper</option>
      <option value="neighbourhood">citation neighbourhood</option>
    </select>
  </label>
  <label>model <select id="model"><option value="">(loading)</option></select></label>
  <label>quant <select id="quant"></select></label>
  <button type="button" id="adv-btn" title="Advanced settings">⚙</button>
  <div id="dl-modal" hidden>
    <div class="dl-box">
      <h4>Download a model from Hugging Face</h4>
      <p class="adv-note" id="dl-device"></p>
      <form id="dl-form">
        <input id="dl-repo" type="text" spellcheck="false" autocomplete="off"
               placeholder="owner/name — e.g. Qwen/Qwen3-8B, or paste a HF URL">
        <button type="submit" id="dl-check">Check</button>
      </form>
      <div id="dl-info"></div>
      <div id="dl-progress" hidden>
        <div class="bar"><span></span></div>
        <p class="adv-note" id="dl-progress-text"></p>
      </div>
      <div class="dl-actions">
        <button type="button" id="dl-start" hidden>Download</button>
        <button type="button" id="dl-close">Close</button>
      </div>
    </div>
  </div>

  <div id="advanced" hidden>
    <h4>Advanced</h4>
    <label class="adv">passage heatmap
      <select id="heat-mode">
        <option value="answer">similar to the answer passage</option>
        <option value="query">similar to my question</option>
        <option value="off">off</option>
      </select>
    </label>
    <p class="adv-note" id="heat-note"></p>
    <label class="adv">highlight top
      <input id="heat-k" type="range" min="1" max="15" step="1" value="5">
      <span id="heat-k-val">5</span> passages
    </label>
    <label class="adv">temperature
      <input id="temp" type="range" min="0" max="1.5" step="0.05" value="0.2">
      <span id="temp-val">0.20</span>
    </label>
    <p class="adv-note">Lower is more literal and repeatable; higher is more exploratory
      and more likely to drift from the sources.</p>
  </div>
  <label class="breadth" id="breadth-label">
    <span class="cap">answer depth</span>
    <input id="breadth" type="range" min="0" max="4" step="1" value="2">
    <span id="breadth-val"></span>
  </label>
  <label>font
    <select id="font">
      <option value="serif">Serif</option>
      <option value="sans" selected>Sans</option>
      <option value="mono">Mono</option>
      <option value="dyslexic">Wide</option>
    </select>
  </label>
  <label>size
    <input id="fontsize" type="range" min="13" max="24" step="1" value="16"><span id="fontsize-val">16</span>
  </label>
  <span id="status" class="status"></span>
</header>

<main>
  <section id="graph-pane">
    <h2>Citation graph <small id="graph-hint">heat = relevance to your question</small></h2>
    <canvas id="graph"></canvas>
    <div id="graph-tip" hidden></div>
  </section>

  <div class="splitter" id="split-left" title="Drag to resize · double-click to reset"></div>

  <section id="paper-pane">
    <div id="paper-meta"></div>
    <article id="paper"><p class="placeholder">Enter an arXiv id to open a paper, or type a question to search the corpus.</p></article>
    <div id="results" hidden>
      <div id="results-head"></div>
      <div id="results-controls">
        <div id="results-toggle">
          <button type="button" data-view="graph" class="on">Citation graph</button>
          <button type="button" data-view="list">List</button>
        </div>
        <label>show top
          <input id="topk" type="range" min="5" max="60" step="5" value="20">
          <span id="topk-val">20</span> papers
        </label>
      </div>
      <div id="graph-wrap">
        <canvas id="results-graph"></canvas>
        <div id="results-labels"></div>
        <div id="results-tip" hidden></div>
      </div>
      <ol id="results-list" hidden></ol>
    </div>
  </section>

  <div class="splitter" id="split-right" title="Drag to resize · double-click to reset"></div>

  <section id="chat-pane">
    <div id="messages"></div>
    <form id="ask-form">
      <textarea id="question" rows="3" placeholder="Ask about the paper, or highlight a passage first…"></textarea>
      <div id="selection-chip" hidden><span></span><button type="button" id="clear-sel">×</button></div>
      <button type="submit" id="ask-btn">Ask</button>
    </form>
  </section>
</main>

<button id="ask-float" hidden>Ask about this</button>
<script type="module" src="/app.js"></script>
</body>
</html>
